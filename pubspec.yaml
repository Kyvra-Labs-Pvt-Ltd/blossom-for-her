publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.6.0
  video_player: ^2.11.1
  flutter_reactive_ble: ^5.6.0
  permission_handler: ^13.0.2
